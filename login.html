<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Ledger personal finance dashboard.">
    <title>Sign in | Ledger</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111512">
</head>
<body class="auth-body" data-google-client-id="171352585547-2rnltfiha2a1rkdi4ulcatn2g234gni4.apps.googleusercontent.com">
    <main class="auth-layout">
        <section class="auth-intro">
            <a class="brand" href="login.html"><span class="brand-mark">L</span><span><strong>ledger</strong><small>personal finance</small></span></a>
            <div><h1>Make every naira count.</h1><p>A clear place for your daily spending, monthly budget, and the small decisions that add up.</p></div>
            <div class="auth-intro-footer"><span>◒</span> Your money, made visible.</div>
        </section>
        <section class="auth-card" aria-labelledby="login-title">
            <a class="back-home" href="index.html">← Back to Ledger home</a>
            <p class="eyebrow">Welcome back</p>
            <h2 id="login-title">Sign in to Ledger</h2>
            <p class="muted">Pick up where you left off.</p>
            <form class="auth-form" id="login-form" novalidate>
                <div><label for="username">Email address</label><input id="username" type="email" autocomplete="email" placeholder="you@example.com" required></div>
                <div><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></div>
                <p class="auth-message" id="auth-message" role="alert"></p>
                <button class="primary-button" type="submit"><span class="submit-label">Sign in</span><span class="submit-arrow">↗</span></button>
            </form>
            <div class="auth-divider"><span>or</span></div>
            <button class="google-button" id="google-auth-button" type="button"><img class="google-logo" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Continue with Google</button>
            <p class="auth-switch">New to Ledger? <a href="signup.html">Create an account</a></p>
        </section>
    </main>
    <script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button[type="submit"]');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const message = document.getElementById('auth-message');
            if (!username || !password) { message.textContent = 'Enter your email address and password.'; return; }
            button.disabled = true;
            button.querySelector('.submit-label').textContent = 'Signing in...';
            try {
                const { error } = await ledgerSupabase.auth.signInWithPassword({ email: username, password });
                if (error) { message.textContent = error.message; return; }
                window.location.href = 'dashboard.html';
            } catch (error) {
                message.textContent = 'Connection failed. Check your internet connection and try again.';
            } finally {
                button.disabled = false;
                button.querySelector('.submit-label').textContent = 'Sign in';
            }
        });
    </script>
    <script src="google-auth.js"></script><script src="auth-redirect.js"></script><script src="pwa.js"></script>
</body>
</html>
